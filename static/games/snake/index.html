<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>贪吃蛇</title>
<style>
  html,body{margin:0;height:100%;background:#16161a;color:#e8e8ea;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft Yahei",sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;padding:10px}
  #hud{display:flex;gap:18px;align-items:center;font-size:14px;letter-spacing:.5px}
  #hud b{color:#7cd97c}
  #stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  #board{position:relative;touch-action:none}
  canvas{display:block;border-radius:10px;background:#1f1f25;box-shadow:0 0 0 1px #2c2c34 inset}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:rgba(16,16,22,.72);border-radius:10px;text-align:center;padding:16px;box-sizing:border-box}
  #overlay.hide{display:none}
  button{font:inherit;color:#16161a;background:#7cd97c;border:0;border-radius:8px;padding:9px 20px;cursor:pointer;font-weight:600}
  .tip{font-size:13px;color:#9a9aa2;line-height:1.7}
  #title{font-size:20px;font-weight:700}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span>得分 <b id="score">0</b></span><span>最高 <b id="best">0</b></span></div>
  <div id="stage"><div id="board">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <div id="title">贪吃蛇</div>
      <div class="tip">方向键 / WASD 移动 · 手机滑动屏幕<br>吃到食物得分，别撞墙或自己</div>
      <button id="start">开始</button>
    </div>
  </div></div>
</div>
<script>
  const N = 20;
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const board = document.getElementById('board'), overlay = document.getElementById('overlay');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  const titleEl = document.getElementById('title'), tipEl = overlay.querySelector('.tip'), startBtn = document.getElementById('start');
  let cell = 16, snake, dir, nextDir, food, timer, score = 0, running = false;
  let best = +(localStorage.getItem('snake_best') || 0);
  bestEl.textContent = best;

  function fit() {
    const avail = Math.min(board.parentElement.clientWidth, board.parentElement.clientHeight) - 16;
    const size = Math.max(160, Math.floor(avail / N) * N);
    cell = size / N;
    cv.width = size; cv.height = size;
    draw();
  }
  function reset() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = dir; score = 0; scoreEl.textContent = 0; placeFood();
  }
  function placeFood() {
    do { food = {x:(Math.random()*N)|0, y:(Math.random()*N)|0}; }
    while (snake.some(s => s.x===food.x && s.y===food.y));
  }
  function step() {
    dir = nextDir;
    const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};
    if (head.x<0 || head.y<0 || head.x>=N || head.y>=N || snake.some(s => s.x===head.x && s.y===head.y)) { gameOver(); return; }
    snake.unshift(head);
    if (head.x===food.x && head.y===food.y) { score++; scoreEl.textContent = score; placeFood(); }
    else snake.pop();
    draw();
  }
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function draw() {
    ctx.clearRect(0,0,cv.width,cv.height);
    if (!snake) return;
    ctx.fillStyle = '#ff6b6b'; rr(food.x*cell+cell*0.15, food.y*cell+cell*0.15, cell*0.7, cell*0.7, cell*0.25); ctx.fill();
    snake.forEach((s,i) => { ctx.fillStyle = i ? '#7cd97c' : '#aef0ae'; rr(s.x*cell+1, s.y*cell+1, cell-2, cell-2, cell*0.28); ctx.fill(); });
  }
  function start() { reset(); overlay.classList.add('hide'); running = true; clearInterval(timer); timer = setInterval(step, 110); }
  function gameOver() {
    running = false; clearInterval(timer);
    if (score > best) { best = score; localStorage.setItem('snake_best', best); bestEl.textContent = best; }
    titleEl.textContent = '游戏结束';
    tipEl.innerHTML = '得分 ' + score + ' · 最高 ' + best;
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hide');
  }
  function setDir(x,y) { if (snake && (x !== -dir.x || y !== -dir.y)) nextDir = {x,y}; }
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k==='arrowup'||k==='w') setDir(0,-1);
    else if (k==='arrowdown'||k==='s') setDir(0,1);
    else if (k==='arrowleft'||k==='a') setDir(-1,0);
    else if (k==='arrowright'||k==='d') setDir(1,0);
    else { if (k===' ' && !running) start(); return; }
    e.preventDefault();
  });
  let tx = null, ty = null;
  board.addEventListener('touchstart', e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; }, {passive:true});
  board.addEventListener('touchmove', e => {
    if (tx === null) return;
    const t = e.touches[0], dx = t.clientX-tx, dy = t.clientY-ty;
    if (Math.abs(dx)+Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx>0?1:-1, 0); else setDir(0, dy>0?1:-1);
    tx = null; e.preventDefault();
  }, {passive:false});
  startBtn.addEventListener('click', start);
  addEventListener('resize', fit);
  reset(); fit();
</script>
</body>
</html>
