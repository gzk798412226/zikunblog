<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2048</title>
<style>
  html,body{margin:0;height:100%;background:#16161a;color:#e8e8ea;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft Yahei",sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-sizing:border-box;padding:12px}
  #top{display:flex;gap:12px;align-items:center}
  .box{background:#2a2a32;border-radius:8px;padding:6px 14px;text-align:center;min-width:62px}
  .box small{display:block;font-size:11px;color:#9a9aa2;letter-spacing:1px}
  .box b{font-size:18px}
  #new{font:inherit;color:#16161a;background:#f0c674;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
  #stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  #grid{position:relative;background:#2a2a32;border-radius:10px;touch-action:none}
  .cell,.tile{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:7px;font-weight:700;box-sizing:border-box}
  .cell{background:#1f1f25;z-index:0}
  .tile{transition:transform .09s ease;color:#16161a;z-index:1}
  #ov{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(16,16,22,.8);border-radius:10px}
  #ov.show{display:flex}
  #ov button{font:inherit;color:#16161a;background:#f0c674;border:0;border-radius:8px;padding:9px 20px;cursor:pointer;font-weight:600}
  #ovt{font-size:24px;font-weight:700}
  .tip{font-size:12px;color:#9a9aa2}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div class="box"><small>得分</small><b id="score">0</b></div>
    <div class="box"><small>最高</small><b id="best">0</b></div>
    <button id="new">新游戏</button>
  </div>
  <div id="stage"><div id="grid"><div id="ov"><div id="ovt"></div><button id="again">再来一局</button></div></div></div>
  <div class="tip">方向键 / WASD · 手机滑动 · 合成 2048</div>
</div>
<script>
  const N = 4, GAP = 10;
  const grid = document.getElementById('grid'), ov = document.getElementById('ov'), ovt = document.getElementById('ovt');
  const stage = document.getElementById('stage');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  const COL = {2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
  let board, score, size = 0, tile = 0, cells = [], tiles = new Map(), uid = 0, won = false, dead = false;
  let best = +(localStorage.getItem('g2048_best') || 0);
  bestEl.textContent = best;

  function fit() {
    const avail = Math.min(stage.clientWidth, stage.clientHeight) - 12;
    size = Math.max(180, avail); tile = (size - GAP*(N+1)) / N;
    grid.style.width = size + 'px'; grid.style.height = size + 'px';
    if (!cells.length) {
      for (let i = 0; i < N*N; i++) { const d = document.createElement('div'); d.className = 'cell'; grid.appendChild(d); cells.push(d); }
    }
    cells.forEach((d,i) => pos(d, (i/N)|0, i%N));
    tiles.forEach(t => { pos(t.el, t.r, t.c); style(t); });
  }
  function pos(el,r,c){ el.style.width = tile+'px'; el.style.height = tile+'px'; el.style.transform = 'translate('+(GAP+c*(tile+GAP))+'px,'+(GAP+r*(tile+GAP))+'px)'; }
  function style(t){ const v = t.v; t.el.style.background = COL[v] || '#3c3a32'; t.el.style.color = v>4 ? '#f9f6f2' : '#16161a';
    t.el.textContent = v; t.el.style.fontSize = (v<100 ? tile*0.42 : v<1000 ? tile*0.34 : tile*0.27) + 'px'; }
  function add() {
    const empty = [];
    for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (!board[r][c]) empty.push([r,c]);
    if (!empty.length) return;
    const [r,c] = empty[(Math.random()*empty.length)|0], v = Math.random()<0.9 ? 2 : 4;
    const el = document.createElement('div'); el.className = 'tile'; grid.appendChild(el);
    const t = {el, r, c, v, id: uid++}; board[r][c] = t; tiles.set(t.id, t); pos(el, r, c); style(t);
    el.animate([{transform: el.style.transform+' scale(0)'},{transform: el.style.transform+' scale(1)'}], {duration:120});
  }
  function newGame() {
    tiles.forEach(t => t.el.remove()); tiles.clear();
    board = Array.from({length:N}, () => Array(N).fill(null));
    score = 0; scoreEl.textContent = 0; won = false; dead = false; ov.classList.remove('show');
    add(); add();
  }
  function move(dx,dy) {
    if (dead) return;
    let moved = false;
    const order = [];
    for (let r=0;r<N;r++) for (let c=0;c<N;c++) order.push([r,c]);
    if (dx>0 || dy>0) order.reverse();
    const merged = new Set();
    for (const [r,c] of order) {
      const t = board[r][c]; if (!t) continue;
      let nr = r, nc = c;
      while (true) {
        const tr = nr+dy, tc = nc+dx;
        if (tr<0 || tc<0 || tr>=N || tc>=N) break;
        const o = board[tr][tc];
        if (!o) { board[tr][tc] = t; board[nr][nc] = null; nr = tr; nc = tc; moved = true; }
        else if (o.v === t.v && !merged.has(o.id)) {
          o.v *= 2; merged.add(o.id); board[nr][nc] = null; tiles.delete(t.id); t.el.remove(); style(o);
          o.el.animate([{transform:o.el.style.transform+' scale(1)'},{transform:o.el.style.transform+' scale(1.16)'},{transform:o.el.style.transform+' scale(1)'}], {duration:140});
          score += o.v; scoreEl.textContent = score;
          if (o.v === 2048 && !won) { won = true; end('🎉 2048！'); }
          moved = true; break;
        } else break;
      }
      if (board[nr] && board[nr][nc] === t) { t.r = nr; t.c = nc; pos(t.el, nr, nc); }
    }
    if (moved) {
      if (score > best) { best = score; localStorage.setItem('g2048_best', best); bestEl.textContent = best; }
      setTimeout(() => { add(); if (!canMove()) end('游戏结束'); }, 95);
    }
  }
  function canMove() {
    for (let r=0;r<N;r++) for (let c=0;c<N;c++) {
      if (!board[r][c]) return true;
      const v = board[r][c].v;
      if (c+1<N && board[r][c+1] && board[r][c+1].v === v) return true;
      if (r+1<N && board[r+1][c] && board[r+1][c].v === v) return true;
    }
    return false;
  }
  function end(msg) { dead = (msg === '游戏结束'); ovt.textContent = msg; ov.classList.add('show'); }
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase(); let h = true;
    if (k==='arrowup'||k==='w') move(0,-1);
    else if (k==='arrowdown'||k==='s') move(0,1);
    else if (k==='arrowleft'||k==='a') move(-1,0);
    else if (k==='arrowright'||k==='d') move(1,0);
    else h = false;
    if (h) e.preventDefault();
  });
  let tx = null, ty = null;
  grid.addEventListener('touchstart', e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; }, {passive:true});
  grid.addEventListener('touchend', e => {
    if (tx === null) return;
    const t = e.changedTouches[0], dx = t.clientX-tx, dy = t.clientY-ty;
    if (Math.abs(dx)+Math.abs(dy) < 24) { tx = null; return; }
    if (Math.abs(dx) > Math.abs(dy)) move(dx>0?1:-1, 0); else move(0, dy>0?1:-1);
    tx = null;
  }, {passive:true});
  document.getElementById('new').onclick = newGame;
  document.getElementById('again').onclick = newGame;
  addEventListener('resize', fit);
  newGame(); fit();
</script>
</body>
</html>
