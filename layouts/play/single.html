{{ define "main" }}
{{ $src := .Params.gameSrc }}
{{ $ratio := .Params.ratio | default "690 / 527" }}
{{ $ratioM := .Params.ratioMobile | default $ratio }}
{{ $max := .Params.maxWidth | default "720px" }}
<main class="main single" id="main">
    <div class="main-inner">
        <article class="content post h-entry">
            <h1 class="post-title p-name">{{ .Title }}</h1>
            {{ with .Params.subtitle }}<div class="post-subtitle p-name">{{ . }}</div>{{ end }}
            <div class="post-body e-content">
                <div class="game-embed" style="--game-ratio: {{ $ratio | safeCSS }}; --game-ratio-m: {{ $ratioM | safeCSS }}; --game-max: {{ $max | safeCSS }};">
                    <iframe class="game-embed-frame"
                            src="{{ $src }}"
                            title="{{ .Title }}"
                            loading="lazy"
                            allow="fullscreen; autoplay; gamepad"
                            allowfullscreen></iframe>
                    <button type="button" class="game-embed-fs" aria-label="全屏 / 退出全屏" title="全屏">⛶</button>
                </div>
                <p class="game-embed-back"><a href="{{ "/play/" | relLangURL }}">← 返回游戏列表</a></p>
            </div>
        </article>
    </div>
</main>
<style>
    .game-embed {
        position: relative;
        width: 100%;
        max-width: var(--game-max, 720px);
        aspect-ratio: var(--game-ratio, 690 / 527);
        margin: 1.2rem auto 0;
        border-radius: 8px;
        overflow: hidden;
        background: #16161a;
        box-shadow: 0 2px 18px rgba(0, 0, 0, .28);
    }
    .game-embed-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    }
    .game-embed-fs {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 2;
        width: 34px;
        height: 34px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: rgba(0, 0, 0, .45);
        color: #fff;
        font-size: 16px;
        line-height: 34px;
        text-align: center;
        cursor: pointer;
        opacity: .5;
        transition: opacity .2s;
    }
    .game-embed:hover .game-embed-fs,
    .game-embed-fs:focus { opacity: 1; }
    .game-embed:fullscreen,
    .game-embed:-webkit-full-screen {
        max-width: none;
        width: 100vw;
        height: 100vh;
        aspect-ratio: auto;
        border-radius: 0;
        margin: 0;
    }
    .game-embed-back { margin-top: 1rem; text-align: center; }
    @media (max-width: 560px) {
        .game-embed { max-width: 100%; aspect-ratio: var(--game-ratio-m, var(--game-ratio, 1 / 1)); }
    }
</style>
<script>
    (function () {
        var box = document.querySelector('.game-embed');
        if (!box) return;
        var btn = box.querySelector('.game-embed-fs');
        btn.addEventListener('click', function () {
            var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
            if (fsEl) {
                (document.exitFullscreen || document.webkitExitFullscreen).call(document);
            } else {
                (box.requestFullscreen || box.webkitRequestFullscreen).call(box);
            }
        });
    })();
</script>
{{ end }}
